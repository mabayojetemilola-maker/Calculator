<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="Hassan Calculator - A modern, premium calculator with scientific mode and history">
  <title>Hassan Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon">◆</span>
        <span class="brand-name">Hassan Calculator</span>
      </div>
      <div class="mode-toggle">
        <button id="basicModeBtn" class="mode-btn active" aria-label="Basic mode">Basic</button>
        <button id="scientificModeBtn" class="mode-btn" aria-label="Scientific mode">Scientific</button>
      </div>
    </header>

    <main class="calculator">
      <section class="display-section">
        <div class="history-preview" id="historyPreview"></div>
        <div class="expression" id="expression" aria-live="polite"></div>
        <div class="result" id="result" aria-live="polite">0</div>
      </section>

      <section class="history-panel" id="historyPanel">
        <div class="history-header">
          <span>History</span>
          <button id="clearHistoryBtn" class="clear-history-btn" aria-label="Clear history">Clear</button>
        </div>
        <div class="history-list" id="historyList">
          <p class="history-empty">No calculations yet</p>
        </div>
      </section>

      <section class="keypad" id="keypad">
        <!-- Basic keypad -->
        <div class="keypad-basic" id="basicKeypad">
          <button class="key key-func" data-action="clear" aria-label="All Clear">AC</button>
          <button class="key key-func" data-action="toggle-sign" aria-label="Toggle sign">±</button>
          <button class="key key-func" data-action="percent" aria-label="Percent">%</button>
          <button class="key key-op" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

          <button class="key key-num" data-action="number" data-value="7">7</button>
          <button class="key key-num" data-action="number" data-value="8">8</button>
          <button class="key key-num" data-action="number" data-value="9">9</button>
          <button class="key key-op" data-action="operator" data-value="×" aria-label="Multiply">×</button>

          <button class="key key-num" data-action="number" data-value="4">4</button>
          <button class="key key-num" data-action="number" data-value="5">5</button>
          <button class="key key-num" data-action="number" data-value="6">6</button>
          <button class="key key-op" data-action="operator" data-value="-" aria-label="Subtract">−</button>

          <button class="key key-num" data-action="number" data-value="1">1</button>
          <button class="key key-num" data-action="number" data-value="2">2</button>
          <button class="key key-num" data-action="number" data-value="3">3</button>
          <button class="key key-op" data-action="operator" data-value="+" aria-label="Add">+</button>

          <button class="key key-num key-zero" data-action="number" data-value="0">0</button>
          <button class="key key-num" data-action="decimal" aria-label="Decimal">.</button>
          <button class="key key-del" data-action="backspace" aria-label="Backspace">DEL</button>
          <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
        </div>

        <!-- Scientific keypad -->
        <div class="keypad-scientific hidden" id="scientificKeypad">
          <button class="key key-sci" data-action="func" data-value="sin" aria-label="Sine">sin</button>
          <button class="key key-sci" data-action="func" data-value="cos" aria-label="Cosine">cos</button>
          <button class="key key-sci" data-action="func" data-value="tan" aria-label="Tangent">tan</button>
          <button class="key key-sci" data-action="func" data-value="log" aria-label="Log base 10">log</button>
          <button class="key key-sci" data-action="func" data-value="ln" aria-label="Natural log">ln</button>

          <button class="key key-sci" data-action="func" data-value="sqrt" aria-label="Square root">√</button>
          <button class="key key-sci" data-action="func" data-value="square" aria-label="Square">x²</button>
          <button class="key key-sci" data-action="operator" data-value="^" aria-label="Power">xʸ</button>
          <button class="key key-sci" data-action="const" data-value="π" aria-label="Pi">π</button>
          <button class="key key-sci" data-action="const" data-value="e" aria-label="Euler's number">e</button>

          <button class="key key-sci" data-action="paren" data-value="(" aria-label="Open parenthesis">(</button>
          <button class="key key-sci" data-action="paren" data-value=")" aria-label="Close parenthesis">)</button>
          <button class="key key-sci" data-action="func" data-value="fact" aria-label="Factorial">n!</button>
          <button class="key key-func" data-action="clear" aria-label="All Clear">AC</button>
          <button class="key key-del" data-action="backspace" aria-label="Backspace">DEL</button>

          <button class="key key-num" data-action="number" data-value="7">7</button>
          <button class="key key-num" data-action="number" data-value="8">8</button>
          <button class="key key-num" data-action="number" data-value="9">9</button>
          <button class="key key-op" data-action="operator" data-value="÷" aria-label="Divide">÷</button>
          <button class="key key-func" data-action="percent" aria-label="Percent">%</button>

          <button class="key key-num" data-action="number" data-value="4">4</button>
          <button class="key key-num" data-action="number" data-value="5">5</button>
          <button class="key key-num" data-action="number" data-value="6">6</button>
          <button class="key key-op" data-action="operator" data-value="×" aria-label="Multiply">×</button>
          <button class="key key-func" data-action="toggle-sign" aria-label="Toggle sign">±</button>

          <button class="key key-num" data-action="number" data-value="1">1</button>
          <button class="key key-num" data-action="number" data-value="2">2</button>
          <button class="key key-num" data-action="number" data-value="3">3</button>
          <button class="key key-op" data-action="operator" data-value="-" aria-label="Subtract">−</button>
          <button class="key key-op" data-action="operator" data-value="+" aria-label="Add">+</button>

          <button class="key key-num key-zero-sci" data-action="number" data-value="0">0</button>
          <button class="key key-num" data-action="decimal" aria-label="Decimal">.</button>
          <button class="key key-equals key-equals-sci" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>

      <button class="history-toggle" id="historyToggle" aria-label="Toggle history">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>History</span>
      </button>
    </main>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
